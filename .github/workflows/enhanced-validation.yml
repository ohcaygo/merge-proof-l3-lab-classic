name: Exact Enhanced Linux identity and static Git acceptance
on:
  push:
    branches: [l3-enhanced-os-4f14f77]
permissions:
  contents: read
  actions: read
jobs:
  operating-system:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.12.0'
      - name: Restore exact already-tested source archive
        run: |
          git init fixture
          git -C fixture remote add origin https://github.com/ohcaygo/merge-proof-l3-lab-classic.git
          git -C fixture fetch --depth=1 origin "$GITHUB_SHA"
          git -C fixture checkout --detach FETCH_HEAD
          echo '45d43ac53e0ffd6812ebdffe4487a77f248ddb48c26c1b9ced7d498c76d4fac2  fixture/candidate.tar.gz' | sha256sum -c -
          mkdir candidate output
          tar -xzf fixture/candidate.tar.gz -C candidate
          cp fixture/source-product-commit.txt output/
          namei -l "$PWD/candidate/github/policy-broker.js" > output/runner-path-permissions.txt
          sudo -u '#65533' test -r "$PWD/candidate/github/policy-broker.js" && echo RUNNER_PATH_READABLE > output/runner-path-access.txt || echo RUNNER_PATH_NOT_READABLE > output/runner-path-access.txt
      - name: Stage immutable source in the intended root-owned public-code layout
        run: |
          sudo cp -a candidate /opt/merge-proof-isolation-candidate
          sudo chown -R root:root /opt/merge-proof-isolation-candidate
          sudo chmod -R a+rX /opt/merge-proof-isolation-candidate
          sudo -u '#65533' test -r /opt/merge-proof-isolation-candidate/github/policy-broker.js
          sudo "$(command -v node)" /opt/merge-proof-isolation-candidate/github/operations/isolation-acceptance.js > output/linux-uid-isolation.json
      - name: Verify retained static Git runtime and complete reconstruction suite
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35489128375 --repo ohcaygo/merge-proof-l3-lab-classic -n l3-static-runtime --dir runtime
          docker run --rm -v "$PWD/candidate:/candidate:ro" -v "$PWD/runtime:/runtime:ro" -v "$PWD/output:/out" alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8 sh -ec '
            mkdir -p /opt
            tar -xzf /runtime/git-runtime.tar.gz -C /opt
            echo "3d2b9bc579af799be2f88ed81c01cec14e4f469dbf6fef377322c29710e66d2b  /opt/merge-proof-git/bin/git" | sha256sum -c -
            echo "f5b324107f840a22e82440e0c1bbeb6687da6f481142d5fec6fbc03085478c23  /opt/merge-proof-git/libexec/git-core/git-remote-https" | sha256sum -c -
            apk add --no-cache nodejs
            ln -sf /opt/merge-proof-git/bin/git /usr/bin/git
            cp -a /candidate /corpus
            cd /corpus
            node --test github/test/chain.test.js > /out/static-reconstruction-tests.txt 2>&1
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: l3-enhanced-os-acceptance
          path: output/
          retention-days: 7
